# Imagem versionada: STEEL_IMAGE_TAG (CalVer da release, ex. 2026.09.18.1) é
# gravado no .env deste diretório por scripts/deploy.sh — nunca edite à mão
# nem volte para :latest (sem tag não há rollback determinístico).
x-steel-image: &steel-image ghcr.io/stratus-so2/steel:${STEEL_IMAGE_TAG:?STEEL_IMAGE_TAG não definido; use scripts/deploy.sh <tag>}

services:
  steel-app:
    image: *steel-image
    container_name: nextjs-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./redis-tls/ca.crt:/etc/redis-tls/ca.crt:ro
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - app-network

  steel-worker:
    image: *steel-image
    container_name: steel-worker
    restart: unless-stopped
    command: ["node", "dist/worker.cjs"]
    env_file:
      - .env
    volumes:
      - ./redis-tls/ca.crt:/etc/redis-tls/ca.crt:ro
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - app-network

networks:
  app-network:
    external: true
    name: steel_default
